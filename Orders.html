<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- FA -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!--CSS -->
    <link rel="stylesheet" href="Css/style.css" />
    <link rel="stylesheet" href="./Css/order.css" />

    <title>Foodie-orders</title>
  </head>
  <body>
    <!-- ////////////////////////////////////////////////////// -->
    <div id="navbar"></div>
    <!-- ///////////////////////////////////////////////////// -->

    <!-- Orders Section -->
    <section id="orders-section" class="py-5 mt-4">
      <div class="container px-4 px-lg-5">
        <h3 class="fw-bold mb-4 text-dark">My Orders</h3>

        <!-- Orders Container (here we can put the api data) -->
        <div class="d-flex flex-column gap-3" id="api-orders-container"></div>
      </div>
    </section>

    <!-- Order Details Modal -->
    <div
      class="modal fade"
      id="orderDetailsModal"
      tabindex="-1"
      aria-labelledby="orderDetailsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
          <div class="modal-header border-0 pb-0">
            <h5
              class="modal-title fw-bold text-dark"
              id="orderDetailsModalLabel"
            >
              Order Details
            </h5>
            <button
              type="button"
              class="btn-close shadow-none"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body py-4">
            <div id="modalOrderContent" class="d-flex flex-column gap-3">
              <!-- Dynamic order details will be injected here -->
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button
              type="button"
              class="btn btn-dark w-100 py-2 rounded-3"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- /////////////////////////////////////// -->
    <div id="footer"></div>
    <!-- /////////////////////////////////////// -->

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/component.js"></script>
    <script src="./JS/cartBadge.js"></script>
    
    <script src="./JS/orders.js"></script>
 

  </body>
</html>
