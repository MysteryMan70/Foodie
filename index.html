<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="Css/style.css" />
    <link rel="stylesheet" href="./Css/main.css" />
  </head>
  <body>
    <!-- ////////////////////////////////////////////////////// -->
    <div id="navbar"></div>
    <!-- ///////////////////////////////////////////////////// -->
    <!--~ home section  -->
    <section id="home" class="py-5">
      <div class="container">
        <section id="home1" class="p-3 m-lg-4">
          <div class="row align-items-center">
            <!-- Text -->
            <div
              class="col-lg-6 d-flex flex-column text-lg-start align-items-lg-start justify-content-center align-items-center text-center">
              <div class="welcome">
                <p class="text-color fw-semibold mb-2">Welcome to Foodie</p>
              </div>

              <h1 class="fw-bold display-2 mt-3">
                Delicious Food Delivered
                <span class="text-color">To You</span>
              </h1>
              <p class="opacity-75 fs-6 mt-3 mb-4 w-100">
                Discover and order your favorite meals from the best restaurants
                near you.
              </p>
              <div class="d-flex gap-3">
                <button
                  class="btn btn-style transition buttonhover px-4 py-2 fw-semibold"
                  onclick="window.location.href = 'Menu.html'"  >
                  Order Now
                </button>
                <button
                  class="btn btn-outline-dark px-4 py-2"
                  onclick="window.location.href = 'about.html'" >
                  Know More
                </button>
              </div>
            </div>
            <!-- Burger -->
            <div class="col-lg-6 text-center my-5 p-0">
              <div>
                <img
                  src="./Assests/b0800259-f4c5-4195-ad87-0a2d69fd3772.png"
                  alt="Delicious Burger"
                  class="img-fluid w-100" />
              </div>
            </div>
          </div>
        </section>
        <section id="home2" class="mt-3">
          <div>
            <h3 class="fw-bold">Popular Categories</h3>
          </div>
          <div class="row row-cols-2 row-cols-lg-5 g-3 mt-4">
            <!-- ================= CARD 1 ================= -->
            <div class="col">
              <div
                class="card m-2 category-card d-flex flex-column align-items-center"
                onclick="goToCategory('Pizza')" >
                <img
                  src="./Assests/top-view-delicious-pizza_23-2151868964.jpg"
                  class="mt-3"
                  style="width: 120px; height: 110px; object-fit: cover"
                  alt="Pizza"  />

                <div class="card-body text-center">
                  <h5 class="card-title mb-1">Pizza</h5>
                  <p class="card-text opacity-75" id="PizzaCount">0 items</p>
                </div>
              </div>
            </div>

            <!-- ================= CARD 2 ================= -->
            <div class="col">
              <div
                class="card m-2 category-card d-flex flex-column align-items-center"
                onclick="goToCategory('Burger')" >
                <img
                  src="./Assests/burger-layers-meat-cheese-vegetables-bun-white-background-big-two-lettuce-tomato-cucumber-shown-431967181.jpg"
                  class="mt-3"
                  style="width: 120px; height: 110px; object-fit: cover"
                  alt="Burger" />

                <div class="card-body text-center">
                  <h5 class="card-text">Burger</h5>
                  <p class="card-text opacity-75" id="BurgerCount">0 items</p>
                </div>
              </div>
            </div>

            <!-- ================= CARD 3 ================= -->
            <div class="col">
              <div
                class="card m-2 category-card d-flex flex-column align-items-center"
                onclick="goToCategory('Pasta')"  >
                <img
                  src="./Assests/3725.jpg"
                  class="mt-3"
                  style="width: 120px; height: 110px; object-fit: cover"
                  alt="Pasta" />

                <div class="card-body text-center">
                  <h5 class="card-text">Pasta</h5>
                  <p class="card-text opacity-75" id="PastaCount">0 items</p>
                </div>
              </div>
            </div>

            <!-- ================= CARD 4 ================= -->
            <div class="col">
              <div
                class="card m-2 category-card d-flex flex-column align-items-center"
                onclick="goToCategory('Dessert')" >
                <img
                  src="./Assests/ai-generated-chocolate-mousse-dessert-on-transparent-background-free-png.png"
                  class="mt-3"
                  style="width: 120px; height: 110px; object-fit: cover"
                  alt="Dessert"  />

                <div class="card-body text-center">
                  <h5 class="card-text">Dessert</h5>
                  <p class="card-text opacity-75" id="DessertCount">0 items</p>
                </div>
              </div>
            </div>

            <!-- ================= CARD 5 ================= -->
            <div class="col">
              <div
                class="card m-2 category-card d-flex flex-column align-items-center"
                onclick="goToCategory('Drinks')"  >
                <img
                  src="./Assests/refreshing-glass-of-cola-with-ice-cubes-splashing-out-perfect-for-representing-a-cool-beverage-or-drink-advertisement-png.png"
                  class="mt-3"
                  style="width: 120px; height: 110px; object-fit: cover"
                  alt="Drinks" />

                <div class="card-body text-center">
                  <h5 class="card-text">Drinks</h5>
                  <p class="card-text opacity-75" id="DrinksCount">0 items</p>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="home3" class="mt-5">
          <div class="mt-5 d-flex justify-content-between">
            <h3>Popular Dishes</h3>

            <a
              id="viewall"
              href="#"
              class="text-decoration-none text-color cursol me-5"  >
              View All
            </a>
          </div>

          <div
            id="popularProducts"
            class="row row-cols-2 row-cols-lg-4 g-3 mt-4"
          ></div>
        </section>
        <section id="home4" class="mt-5" style="margin-top: 140px !important">
          <div
            class="row rounded-4 bgcolor m-auto justify-content-center align-items-center offer-banner" >
            <div
              class="offer-text justify-content-center align-items-center text-center row p-4 col-12 col-md-6 col-xl-8"  >
              <div class="col-12 col-xl-6 px-md-5 px-xl-0">
                <h5 class="text-white fs-2 fw-bold">Up to 30% Off</h5>
                <h6 class="text-white fs-5">on your first order</h6>
              </div>
              <div
                class="col-12 col-xl-6 d-flex justify-content-center mt-3 mt-xl-0" >
                <button
                  class="btn text-color transition fw-bold offer-btn d-flex justify-content-center align-items-center"
                  onclick="window.location.href = 'Menu.html'" >
                  Order Now <i class="fa-solid fa-arrow-right arrow-icon"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6 col-12 col-xl-4 offer-image-container d-flex">
              <img
                src="./Assests/437f106f-08da-4497-b202-3a107a6e0c9f.png"
                class="offer-image m-auto w-100"
                alt="Pizza"
              />
            </div>
          </div>
        </section>
      </div>
    </section>

    <!-- /////////////////////////////////////// -->

    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/component.js"></script>
    <script src="JS/main.js"></script>
    <script>
      function goToProduct(id) {
        window.location.href = `./product-details.html?id=${id}`;
      }

      getPopularProducts();
    </script>
    <script src="./JS/cartBadge.js"></script>
 

  </body>
</html>
